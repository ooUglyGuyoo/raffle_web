  background-position:100% 100%;
  background-repeat:no-repeat;

#stage-wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:2; }
#stage {
  width:2422px; height:851px; flex:none;
  transform-origin:center center;
  position:relative;
  display:flex; flex-direction:column;
}
/* ============ 通用组件 ============ */
.glow-text { text-shadow:0 0 30px rgba(180,120,255,.55), 0 0 90px rgba(120,60,220,.35); }
.badge {
  display:inline-flex; align-items:center; gap:12px;
  padding:6px 24px; border-radius:999px;
  background:linear-gradient(135deg,rgba(80,40,140,.55),rgba(40,20,80,.55));
  border:2px solid rgba(210,170,255,.45);
  box-shadow:0 6px 30px rgba(0,0,0,.45), inset 0 0 24px rgba(150,90,255,.18);
  font-size:28px; font-weight:700; letter-spacing:2px; color:#f2e6ff;
}
.badge .dot { width:12px; height:12px; border-radius:50%; background:#c9a4ff; box-shadow:0 0 14px #c9a4ff; }
.badge img { height:80px; max-width:560px; object-fit:contain; display:block; filter:drop-shadow(0 3px 10px rgba(0,0,0,.45)); }
.badge.has-logo { background:transparent; border-color:transparent; padding:2px 8px; box-shadow:none; }
.hint {
  text-align:center; font-size:22px; letter-spacing:3px; color:rgba(255,233,168,.9);
  animation:hintPulse 1.6s ease-in-out infinite;
}
.hint .key {
  display:inline-block; padding:4px 14px; margin:0 8px; border-radius:10px;
  border:2px solid rgba(255,233,168,.7); color:#ffe9a8; font-weight:800; font-size:22px;
  background:rgba(255,233,168,.08); animation:hintKey 1.6s ease-in-out infinite;
}
@keyframes hintPulse { 0%,100%{opacity:1} 50%{opacity:.55} }
@keyframes hintKey { 0%,100%{transform:scale(1)} 50%{transform:scale(1.12)} }
.hidden { display:none !important; }
.btn {
  cursor:pointer; border:none; outline:none; font-family:inherit;
  padding:22px 70px; font-size:38px; font-weight:800; letter-spacing:8px;
  border-radius:999px; color:#fff;
  background:linear-gradient(135deg,#8b5cf6,#6d28d9);
  border:3px solid rgba(255,255,255,.35);
  box-shadow:0 10px 40px rgba(109,40,217,.6);
  transition:transform .15s, box-shadow .15s;
}
.btn:hover { transform:scale(1.05); box-shadow:0 14px 50px rgba(109,40,217,.85); }
.btn:active { transform:scale(.97); }
.btn-ghost {
  background:rgba(255,255,255,.08); border:2px solid rgba(255,255,255,.4);
  box-shadow:none; font-size:28px; padding:16px 44px; letter-spacing:4px;
}
.btn-small { font-size:19px; padding:7px 22px; letter-spacing:2px; }

/* ============ 顶部 ============ */
header {
  display:flex; align-items:flex-start; justify-content:space-between;
  padding:40px 70px 0 70px; flex:none;
}
#title { font-size:64px; font-weight:900; letter-spacing:10px; color:#fff; }
#subtitle { font-size:26px; margin-top:6px; letter-spacing:6px; color:#e3ccff; }
#round-badge {
  font-size:44px; font-weight:900; letter-spacing:6px; color:#ffd97a;
  padding:16px 40px; border-radius:20px;
  border:3px solid rgba(255,217,122,.6);
  background:rgba(40,15,70,.5);
  box-shadow:0 0 40px rgba(255,200,80,.25);
}

/* ============ 主区域 ============ */
main { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; min-height:0; padding:34px 90px 6px; }
.screen { width:100%; display:flex; flex-direction:column; align-items:center; }

/* 解锁 */
#screen-lock .lock-panel {
  background:rgba(30,12,55,.72); border:2px solid rgba(200,160,255,.4);
  border-radius:36px; padding:64px 90px; text-align:center;
  box-shadow:0 20px 80px rgba(0,0,0,.5);
}
#pw-input {
  font-family:inherit; font-size:52px; text-align:center; letter-spacing:14px;
  width:520px; padding:20px 30px; margin:36px 0 28px; border-radius:18px;
  border:3px solid rgba(200,160,255,.5); background:rgba(255,255,255,.06); color:#fff; outline:none;
}
#pw-input:focus { border-color:#c9a4ff; box-shadow:0 0 30px rgba(160,100,255,.4); }
.lock-actions { display:flex; gap:26px; justify-content:center; flex-wrap:wrap; }
.lock-status { margin-top:30px; font-size:26px; color:#cdb6f2; letter-spacing:2px; }

/* 号码范围 */
#screen-ranges .ranges-panel {
  background:rgba(30,12,55,.78); border:2px solid rgba(200,160,255,.4);
  border-radius:36px; padding:44px 80px; min-width:1500px;
  box-shadow:0 20px 80px rgba(0,0,0,.5);
}
.ranges-row {
  display:flex; align-items:center; gap:40px;
  padding:22px 30px; margin-bottom:18px;
  background:rgba(255,255,255,.05); border:2px solid rgba(210,170,255,.3);
  border-radius:22px; font-size:32px; color:#f0e6ff;
}
.ranges-row .cat-name { flex:none; width:180px; font-size:36px; font-weight:800; color:#ffd97a; }
.ranges-row .cat-orig { flex:none; width:230px; color:#cbb3f0; font-size:28px; }
.ranges-row .cat-ticket { flex:1; text-align:center; font-size:36px; font-weight:700; color:#fff; letter-spacing:1px; }
.ranges-row .r-arrow { color:#cbb3f0; margin:0 18px; }
.ranges-row input.rng-inp {
  font-family:inherit; font-size:34px; text-align:center; letter-spacing:3px;
  width:190px; padding:10px 8px; border-radius:14px;
  border:3px solid rgba(200,160,255,.5); background:rgba(255,255,255,.07); color:#fff; outline:none;
}
.ranges-row input.rng-inp:focus { border-color:#ffd97a; box-shadow:0 0 24px rgba(255,200,80,.35); }
.ranges-total { text-align:center; font-size:30px; color:#cdb6f2; margin-top:6px; letter-spacing:2px; }
.ranges-actions { display:flex; gap:24px; justify-content:center; margin-top:26px; }

/* 规则 */
#screen-intro .rules {
  background:rgba(30,12,55,.72); border:2px solid rgba(200,160,255,.4);
  border-radius:36px; padding:54px 80px; max-width:1900px;
  box-shadow:0 20px 80px rgba(0,0,0,.5);
}
#screen-intro .rules h2 { font-size:44px; letter-spacing:8px; color:#ffd97a; margin-bottom:30px; text-align:center; }
#screen-intro .rules ol { list-style:none; counter-reset:r; }
#screen-intro .rules li {
  counter-increment:r; font-size:32px; line-height:1.9; letter-spacing:1px; color:#f0e6ff;
  display:flex; align-items:flex-start; gap:22px;
}
#screen-intro .rules li::before {
  content:counter(r); flex:none; width:44px; height:44px; margin-top:10px;
  border-radius:50%; background:linear-gradient(135deg,#8b5cf6,#6d28d9);
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:26px; color:#fff;
}

/* 奖品卡片网格 */
.prize-grid {
  display:flex; gap:30px; justify-content:center; align-items:stretch;
  width:100%; flex-wrap:wrap;
}
.prize-card {
  flex:1 1 0; min-width:420px; max-width:560px;
  display:flex; flex-direction:column;
  background:linear-gradient(160deg,rgba(56,24,100,.93),rgba(28,11,52,.93));
  border:2px solid rgba(210,170,255,.38); border-radius:32px;
  padding:14px 26px 16px; text-align:center; position:relative;
  box-shadow:0 14px 50px rgba(0,0,0,.5), inset 0 0 40px rgba(120,60,220,.1);
  backdrop-filter:blur(4px);
  transition:transform .3s, box-shadow .3s;
}
.prize-card.locked { border-color:#ffd97a; box-shadow:0 0 60px rgba(255,200,80,.3), 0 14px 50px rgba(0,0,0,.5); transform:translateY(-6px); }
.tier-ribbon {
  position:absolute; top:-18px; left:50%; transform:translateX(-50%);
  padding:8px 32px; border-radius:999px; font-size:24px; font-weight:900; letter-spacing:4px; white-space:nowrap;
  border:2px solid rgba(255,255,255,.6);
}
.t1 { background:linear-gradient(135deg,#ffd24a,#f0a020); color:#3d2600; }
.t2 { background:linear-gradient(135deg,#e6eaf5,#aab4d0); color:#2c3350; }
.t3 { background:linear-gradient(135deg,#e0965a,#b96a2e); color:#3d1f00; }
.t4 { background:linear-gradient(135deg,#d2a7ff,#9b5ce8); color:#2a0f4d; }
.prize-emoji {
  font-size:40px; margin:10px auto 2px;
  width:84px; height:84px; line-height:80px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, rgba(139,92,246,.5), rgba(45,18,90,.9));
  border:2px solid rgba(255,217,122,.55);
  box-shadow:0 8px 30px rgba(0,0,0,.45), inset 0 0 24px rgba(200,150,255,.25);
  filter:none;
}
.prize-img-frame {
  width:190px; height:118px; margin:10px auto 4px;
  border-radius:16px; padding:8px;
  background:linear-gradient(160deg,#ffffff,#ece5f8);
  border:2px solid rgba(255,217,122,.55);
  box-shadow:0 10px 34px rgba(0,0,0,.45), inset 0 0 18px rgba(120,60,220,.12);
  display:flex; align-items:center; justify-content:center;
}
.prize-img-frame img { max-width:100%; max-height:100%; object-fit:contain; }
.prize-name { font-size:29px; font-weight:800; letter-spacing:2px; color:#fff; line-height:1.3; min-height:76px; margin-top:6px; display:flex; align-items:center; justify-content:center; }
.prize-qty { font-size:20px; color:#cbb3f0; margin-top:2px; letter-spacing:2px; }
.num-slots { flex:1; display:grid; gap:12px; justify-content:center; align-content:center; margin-top:8px; }
.num-slot {
  width:auto; height:68px; border-radius:14px; font-size:29px; font-weight:800; letter-spacing:1px;
  background:rgba(10,4,24,.55); border:2px dashed rgba(200,160,255,.45); color:#e9dcff;
  display:flex; align-items:center; justify-content:center; font-variant-numeric:tabular-nums;
  white-space:nowrap; overflow:hidden; padding:0 4px;
}
.num-slot.empty { font-size:28px; color:#cdb6f2; }
/* 数量多时缩小槽位 */
.card-m .num-slot { height:64px; font-size:24px; }
.card-s .num-slot { height:58px; font-size:18px; padding:0 2px; }
.card-xs .num-slots { gap:8px; }
.card-xs .num-slot { height:50px; font-size:19px; padding:0 2px; }
.num-slot.rolling { color:#ffe9a8; border-color:#ffe9a8; box-shadow:0 0 24px rgba(255,220,120,.35); }
.num-slot.win {
  background:linear-gradient(135deg,rgba(255,210,90,.22),rgba(255,170,40,.12));
  border:2px solid #ffd97a; color:#ffedb8;
  box-shadow:0 0 30px rgba(255,200,80,.5);
  animation:winPop .5s cubic-bezier(.2,1.6,.4,1);
}
@keyframes winPop { 0%{transform:scale(.2); opacity:0} 100%{transform:scale(1); opacity:1} }

/* 抽奖按钮(鼠标备用,与提示并排,不占 main 布局) */
#draw-btn { font-size:19px; padding:7px 22px; letter-spacing:3px; margin-left:22px; flex:none; }

/* 谢幕 */
#screen-closing { flex:1; min-height:0; justify-content:center; }
#screen-closing .close-panel {
  background:rgba(30,12,55,.78); border:2px solid rgba(255,217,122,.5);
  border-radius:36px; padding:20px 56px; width:100%; max-width:2100px; max-height:100%; overflow:auto;
  box-shadow:0 20px 80px rgba(0,0,0,.5);
}
#screen-closing h2 { font-size:44px; letter-spacing:10px; color:#ffd97a; margin-bottom:12px; text-align:center; }
#screen-closing .winners { display:flex; gap:48px; justify-content:center; align-items:flex-start; font-size:22px; line-height:1.6; color:#f0e6ff; text-align:left; }
#screen-closing .winners b { color:#ffd97a; }
#screen-closing .winners .rhead { margin-bottom:8px; font-size:28px; color:#c9a4ff; font-weight:800; }
#btn-export-txt { margin-left:30px; }

/* 角标 */
#corner-utils { position:absolute; top:26px; right:34px; display:flex; gap:16px; z-index:5; }
.icon-btn {
  cursor:pointer; border:2px solid rgba(255,255,255,.35); background:rgba(30,12,55,.55);
  color:#fff; font-size:26px; width:64px; height:64px; border-radius:16px;
  display:flex; align-items:center; justify-content:center; font-family:inherit;
}
.icon-btn:hover { background:rgba(80,40,140,.6); }

/* 粒子彩带 */
.particle {
  position:absolute; width:16px; height:16px; border-radius:3px; pointer-events:none; z-index:9;
  animation:fly 1.1s ease-out forwards;
}
@keyframes fly {
  0% { transform:translate(0,0) rotate(0deg); opacity:1; }
  100% { transform:translate(var(--dx),var(--dy)) rotate(560deg); opacity:0; }
}

/* 底部提示 */
footer { flex:none; padding:18px 0 26px; display:flex; align-items:center; justify-content:center; gap:26px; }
#mute-hint { font-size:24px; color:#cbb3f0; }
#sponsor-bar { margin-bottom:26px; }
</style>
</head>

/* ================= 号码池 ================= */
// 类别固定:S/C/V;票面号 = 类别基数 + 4位序号(基数固定 100/600/800,只改序号范围)
const CATS = [
  { key: "S", name: "观众", base: 100 },
  { key: "C", name: "Crew", base: 600 },
  { key: "V", name: "VIP",  base: 800 },
];
const DEFAULT_RANGES = { S: [1, 800], C: [1, 100], V: [1, 50] };

function catByKey(k){ return CATS.find(c => c.key === k); }
function origCode(key, n){ return key + String(n).padStart(3, "0"); }      // S001
function ticketNo(key, n){ return String(catByKey(key).base * 10000 + n); } // 1000001
function fmtTicket(t){ return "No. " + t; }

function buildPool(){
  const ranges = (S && S.ranges) ? S.ranges : DEFAULT_RANGES;
  const p = [];
  for (const c of CATS){
    const [a, b] = ranges[c.key];
    for (let n = a; n <= b; n++) p.push(ticketNo(c.key, n));
  }
  return p;
}
function shuffle(a){
  const b = a.slice();
  const u = new Uint32Array(b.length);
  crypto.getRandomValues(u);
  for (let i = b.length - 1; i > 0; i--){
    const j = u[i] % (i + 1);
    [b[i], b[j]] = [b[j], b[i]];
  }
  return b;
}

let S = load();
function load(){
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (s && Array.isArray(s.pool)) return s;
  } catch(e){}
  return null;
}
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); }
function ensureState(){
  if (!S) { S = { pool: shuffle(buildPool()), drawn: [], started: false }; save(); }
}
function resetAll(){
  S = null;
  localStorage.removeItem(STORAGE_KEY);
}
function drawnCount(){
  if (!S) return 0;
  return S.drawn.reduce((a, d) => a + d.nums.length, 0);
}

/* ================= 号码范围页 ================= */
function getRanges(){
  return (S && S.ranges) ? S.ranges : DEFAULT_RANGES;
}
function rangeCount(ranges){
  let t = 0;
  for (const c of CATS){
    const [a, b] = ranges[c.key];
    t += Math.max(0, b - a + 1);
  }
  return t;
}
function renderRanges(editMode){

function saveRanges(){
  const inputs = [...document.querySelectorAll("#ranges-list .rng-inp")];
  const ranges = {};
  for (const c of CATS) ranges[c.key] = [1, 1];
  for (const inp of inputs){
    const k = inp.dataset.key;
    const v = parseInt(inp.value.replace(/\D/g, ""), 10);
    if (isNaN(v) || v < 1 || v > 9999){ alert("请输入 0001-9999 之间的数字"); return; }
    ranges[k][inp.dataset.end === "1" ? 1 : 0] = v;
  }
  for (const c of CATS){
    if (ranges[c.key][1] < ranges[c.key][0]){ alert(`${c.name}的结束号不能小于起始号`); return; }
  }
  if (rangeCount(ranges) < TOTAL_WINNERS){ alert(`号码总数(${rangeCount(ranges)})少于本轮抽奖需要的 ${TOTAL_WINNERS} 个,请扩大范围`); return; }
  // 确认:修改会重置本场记录
  if (S && S.started && !confirm("已开抽过,修改号码范围会清空已抽记录,确定继续?")) return;
  S = { pool: shuffle(buildPoolFromRanges(ranges)), drawn: [], started: false, ranges };
  save();
  renderRanges(false);
  refreshLockStatus();
  setHint(`按 <span class="key">空格</span> 查看抽奖规则`);
}
function buildPoolFromRanges(ranges){
  const p = [];
  for (const c of CATS){
    const [a, b] = ranges[c.key];
    for (let n = a; n <= b; n++) p.push(ticketNo(c.key, n));
  }
  return p;
}

function prizeCardsRevealOrder(round){

  return round.prizes.slice().sort((a, b) => TIER_RANK[a.tier] - TIER_RANK[b.tier]);

/* ================= 滚动抽奖动画 ================= */
function getCardForTier(tier){
  return [...prizeGrid.children].find(c => c.dataset.tier === tier);
}

function rollTier(tier, nums, onDone){
  const card = getCardForTier(tier);
  const slots = [...card.querySelectorAll(".num-slot")];
  const pool = S.pool;                       // 滚动展示用(剩余池)
  const duration = Math.min(3200, 1500 + 140 * nums.length);
  const start = performance.now();
  let raf;
  function frame(now){
    const t = now - start;
    const k = Math.min(1, t / duration);
    // easeOutCubic,最后一段放慢
    const eased = 1 - Math.pow(1 - k, 3);
    for (let i = 0; i < slots.length; i++){
      const slot = slots[i];
      const appear = Math.min(1, eased * 1.4 - i * 0.08);
      if (appear > 0){
        slot.classList.remove("empty");
        slot.classList.add("rolling");
        if (Math.random() < 0.35) tickSound();
        slot.textContent = pool[(Math.random() * pool.length) | 0];
      }
    }
    if (k < 1){
      raf = requestAnimationFrame(frame);
    } else {
      lockNums(tier, nums, slots);
      onDone();
    }
  }
  raf = requestAnimationFrame(frame);
}

function lockNums(tier, nums, slots){
  const card = getCardForTier(tier);
  nums.forEach((num, i) => {
    const slot = slots[i];
    slot.classList.remove("empty");
    slot.classList.remove("rolling");
    slot.classList.add("win");
    slot.textContent = num;
  });
  card.classList.add("locked");
  burst(card);
  winSound();
  S.drawn.push({ round: curRound, tier, nums, at: Date.now() });
  S.started = true;
  save();
}

function startRoll(){
  if (phase === "rolling" || phase === "locked") return;
  ensureState();
  const round = ROUNDS[curRound - 1];
  const reveal = prizeCardsRevealOrder(round);
  $("draw-btn").classList.add("hidden");
  setHint("正在抽取…");
  phase = "rolling";
  curTierIdx = 0;

  try {
    // 预抽全部号码
    const drawn = [];
    for (const p of reveal) drawn.push(S.pool.splice(0, p.qty));
    save();

    const step = () => {
      if (curTierIdx >= reveal.length){
        phase = "locked";
        lastLockAt = Date.now();
        setHint(`第 ${["一","二","三"][curRound-1]} 轮抽奖完成，按 <span class="key">空格</span> 进入${curRound < 3 ? "下一轮" : "结束页面"}`);
        return;
      }
      const p = reveal[curTierIdx];
      rollTier(p.tier, drawn[curTierIdx], () => {
        curTierIdx++;
        setTimeout(step, 420);
      });
    };
    step();
  } catch (err) {
    phase = "idle";
    setHint("出错: " + err.message);
    console.error(err);
  }
}

/* ================= 粒子效果 ================= */
function burst(el){
  const rect = el.getBoundingClientRect();
  const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
  const colors = ["#ffd97a","#c9a4ff","#ff9de2","#7ee0ff","#b6ff9e"];
  for (let i = 0; i < 26; i++){
    const pt = document.createElement("div");
    pt.className = "particle";
    const ang = Math.random() * Math.PI * 2, dist = 60 + Math.random() * 220;
    pt.style.left = cx + "px";
    pt.style.top = cy + "px";
    pt.style.background = colors[i % colors.length];
    pt.style.setProperty("--dx", Math.cos(ang) * dist + "px");
    pt.style.setProperty("--dy", Math.sin(ang) * dist + "px");
    document.body.appendChild(pt);
    setTimeout(() => pt.remove(), 1200);
  }
}

/* ================= 音频 ================= */
let AC = null, muted = false;
function ensureAudio(){
  if (AC) { if (AC.state === "suspended") AC.resume(); return; }
  AC = new (window.AudioContext || window.webkitAudioContext)();
  startBGM();
}
function tickSound(){
  if (!AC || muted) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = "sine"; o.frequency.value = 1300 + Math.random() * 500;
  g.gain.value = 0.02;
  o.connect(g).connect(AC.destination);
  o.start(); o.stop(AC.currentTime + 0.03);
}
function winSound(){
  if (!AC || muted) return;
  const notes = [523.25, 659.25, 783.99, 1046.5];
  notes.forEach((f, i) => {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = "triangle"; o.frequency.value = f;
    const t = AC.currentTime + i * 0.09;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.12, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
    o.connect(g).connect(AC.destination);
    o.start(t); o.stop(t + 0.55);
  });
}
/* 背景音乐:轻柔和弦 Pad 循环 */
const CHORDS = [
  [130.81, 164.81, 196.00, 246.94],   // Cmaj7
  [110.00, 164.81, 196.00, 261.63],   // Am7
  [174.61, 220.00, 261.63, 329.63],   // Fmaj7
  [98.00, 146.83, 196.00, 246.94],    // G
];
let bgmTimer = null;
function startBGM(){
  let ci = 0;
  const playChord = () => {
    if (!AC || muted) return;
    const now = AC.currentTime;
    const g = AC.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(0.035, now + 1.6);
    g.gain.linearRampToValueAtTime(0.0001, now + 3.9);
    g.connect(AC.destination);
    CHORDS[ci % CHORDS.length].forEach(f => {
      const o = AC.createOscillator();
      o.type = "sine"; o.frequency.value = f;
      o.connect(g); o.start(now); o.stop(now + 4.2);
    });
    ci++;
  };
  playChord();
  bgmTimer = setInterval(playChord, 4000);
}

/* ================= 导出 ================= */
function buildRecords(){
  const rows = [];
  for (const d of S.drawn){
    rows.push({ round: d.round, tier: d.tier, nums: d.nums });
  }
  // 按轮次/奖项排序(一等奖在前)
  rows.sort((a, b) => a.round - b.round || TIER_RANK[b.tier] - TIER_RANK[a.tier]);
  return rows;
}
function exportFile(filename, text, mime){
  const blob = new Blob([text], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 400);
}
function exportTxt(){
  if (!S || !S.drawn.length){ alert("本场还没有抽奖记录"); return; }
  let t = "HKUSTMSSS 2026迎新晚会 幸运大抽奖 · 中奖名单\n";
  t += "导出时间: " + new Date().toLocaleString("zh-CN") + "\n\n";
  for (const d of buildRecords()){
    t += `第${["一","二","三"][d.round-1]}轮 | ${d.tier} | ${d.nums.map(fmtTicket).join(", ")}\n`;
  }
  exportFile("中奖名单.txt", t, "text/plain;charset=utf-8");
}
function exportCsv(){
  if (!S || !S.drawn.length){ alert("本场还没有抽奖记录"); return; }
  let t = "\uFEFF轮次,奖项,奖品,中奖编号\n";

/* ================= 状态推进 ================= */
let flow = "lock";   // lock -> ranges -> intro -> game

function advance(){
  if (!unlocked) return;
  ensureAudio();
  if (flow === "ranges"){
    flow = "intro";
    showScreen("intro");
    updateRulesText();
    setHint(`按 <span class="key">空格</span> 开始第一轮`);
    return;
  }
  if (flow === "intro"){
    flow = "game";
    showScreen("game");
    renderRound(1);
    return;
  }
  if (phase === "rolling") return;
  if (phase === "locked"){
    if (Date.now() - lastLockAt < 2000) return;   // 防连按
  }
  if (curRound === 0){
    showScreen("game");
    renderRound(1);
  } else if (phase === "idle"){
    startRoll();
  } else if (phase === "locked"){
    phase = "idle";
    if (curRound < 3){
      renderRound(curRound + 1);
    } else {
      clearHint();
      roundBadge.classList.add("hidden");
      renderClosing();
      showScreen("closing");
      $("btn-export-txt").classList.remove("hidden");
      $("btn-export-csv").classList.remove("hidden");
    }
  }
}

  addEventListener("keydown", e => {

  // 按钮

  $("btn-ranges-edit").addEventListener("click", () => renderRanges(true));
  $("btn-ranges-save").addEventListener("click", saveRanges);
  $("btn-ranges-cancel").addEventListener("click", () => renderRanges(false));
  $("draw-btn").addEventListener("click", () => { if (unlocked) advance(); });
  $("btn-reset").addEventListener("click", () => {
    if (!confirm("确定重置本场记录?已抽取的号码将被清空,可重新开始。")) return;
    resetAll();
    refreshLockStatus();
  });
  $("btn-export-txt").addEventListener("click", exportTxt);
  $("btn-export-csv").addEventListener("click", exportCsv);
  $("btn-mute").addEventListener("click", () => {
    muted = !muted;
    $("btn-mute").textContent = muted ? "🔇" : "🔊";
    $("mute-hint").textContent = muted ? "已静音" : "";
    $("mute-hint").classList.toggle("hidden", !muted);
  });
  $("btn-fs").addEventListener("click", () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  });

  // 已解锁直接进号码范围页
  if (unlocked){
    flow = "ranges";
    showScreen("ranges");
    renderRanges(false);
    setHint(`按 <span class="key">空格</span> 查看抽奖规则`);
  } else {
    showScreen("lock");
  }
}
init();
</script>
</body>
</html>
